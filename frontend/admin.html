<!doctype html>
<html lang="uk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Strict CSP (ADR-0002): no inline script, no eval, no frames or plugins; the page talks only to itself, the cloud API
      and Firebase (sign-in + the settings profile). GitHub Pages sets no headers, so it lives in a meta tag.
      Keep this page free of inline scripts: they would not run. The theme and language are applied by src/admin/main.tsx.
      The dev server drops this tag (Vite's own dev scripts are inline); the build keeps it (vite.config.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://chords-api-84488579848.europe-west1.run.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firestore.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0c0e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chords Listener</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
