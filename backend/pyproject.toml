[project]
name = "chords-listener"
version = "0.1.0"
description = "Local chord recognition server (YouTube + audio files)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2",
    "librosa>=0.11.0",
    "madmom",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
]

[tool.uv]
package = false

[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
