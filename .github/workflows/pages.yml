# Builds the web UI as a static site and publishes it to GitHub Pages:
# https://shchadylotaras.github.io/chords-listener/
# The hosted page is the whole service: guests analyze files and recordings in the browser; signed-in users
# use the cloud API (Cloud Run, docs/CLOUD.md) for YouTube links, uploads and their library. The API URL comes
# from the repository variable CLOUD_API_URL (Settings → Secrets and variables → Actions → Variables); when it
# is not set, the build uses the fallback in frontend/src/config.ts. See README → "Онлайн-версія".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push supersedes a queued one, a running deploy is not cut off
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Type-check and build (base /chords-listener/)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # empty when the variable is not set: frontend/src/config.ts falls back to the deployed URL
          VITE_CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
